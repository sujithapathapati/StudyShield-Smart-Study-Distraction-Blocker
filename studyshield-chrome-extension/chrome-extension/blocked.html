<!doctype html>
<html><head><meta charset="utf-8" /><title>Blocked by StudyShield</title><style>
  body{margin:0;height:100vh;display:grid;place-items:center;background:#141f1a;color:#eef2e6;font:16px system-ui;text-align:center;padding:20px}
  h1{font-size:40px;margin:0 0 8px;color:#b9e65a}
  .goal{margin-top:12px;padding:8px 16px;border-radius:999px;background:#1d2a24;border:1px solid #33463c;color:#b9e65a;display:inline-block}
</style></head><body>
  <div>
    <h1>🛡️ Stay focused</h1>
    <p>This site is blocked until you complete your current StudyShield goal.</p>
    <div id="goal" class="goal" style="display:none"></div>
  </div>
  <script>
    chrome.storage.local.get(["goalTitle"], ({ goalTitle }) => {
      if (goalTitle) {
        const el = document.getElementById("goal");
        el.textContent = "Active Goal: " + goalTitle;
        el.style.display = "inline-block";
      }
    });
  </script>
</body></html>
